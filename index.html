
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 장소 검색</title>

    <style>
        /* 전체 페이지의 기본 설정 */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Malgun Gothic", sans-serif;
            color: #222;
        }

        /* 화면을 왼쪽과 오른쪽으로 나눕니다 */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 검색 영역 */
        .sidebar {
            width: 360px;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            padding: 24px 20px;
            background-color: #ffffff;
            border-right: 1px solid #dddddd;
            overflow: hidden;
        }

        .title {
            margin: 0 0 20px;
            font-size: 24px;
        }

        /* 검색창과 버튼 */
        .search-form {
            display: flex;
            gap: 8px;
        }

        .search-input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .search-button {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            background-color: #fee500;
            font-weight: bold;
            cursor: pointer;
        }

        .search-button:hover {
            background-color: #f5dc00;
        }

        /* 상태 메시지 */
        .status {
            margin: 14px 0;
            color: #666666;
            font-size: 13px;
            line-height: 1.5;
        }

        /* 검색 결과 목록 */
        .result-list {
            flex: 1;
            overflow-y: auto;
            border-top: 1px solid #eeeeee;
        }

        .result-item {
            padding: 15px 4px;
            border-bottom: 1px solid #eeeeee;
            cursor: pointer;
        }

        .result-item:hover {
            background-color: #fffbea;
        }

        .place-name {
            margin-bottom: 7px;
            font-size: 16px;
            font-weight: bold;
        }

        .place-category {
            margin-bottom: 5px;
            color: #777777;
            font-size: 12px;
        }

        .place-address {
            color: #555555;
            font-size: 13px;
            line-height: 1.5;
        }

        .place-phone {
            margin-top: 5px;
            color: #777777;
            font-size: 12px;
        }

        .place-link {
            display: inline-block;
            margin-top: 8px;
            color: #2468c9;
            font-size: 13px;
            text-decoration: none;
        }

        /* 오른쪽 지도 영역 */
        .map-area {
            flex: 1;
            min-width: 0;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* 모바일 화면 대응 */
        @media (max-width: 700px) {
            .container {
                flex-direction: column;
                height: 100vh;
            }

            .sidebar {
                width: 100%;
                min-width: 0;
                height: 45%;
                padding: 16px;
                border-right: none;
                border-bottom: 1px solid #dddddd;
            }

            .title {
                font-size: 20px;
                margin-bottom: 12px;
            }

            .map-area {
                flex: 1;
                min-height: 0;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- 왼쪽 검색창과 결과 목록 -->
        <aside class="sidebar">
            <h1 class="title">장소 검색</h1>

            <form class="search-form" id="searchForm">
                <input
                    type="text"
                    class="search-input"
                    id="keyword"
                    placeholder="장소를 검색하세요"
                    aria-label="장소 검색어"
                    required
                >
                <button type="submit" class="search-button">
                    검색
                </button>
            </form>

            <p class="status" id="status">
                지도를 불러오는 중입니다.
            </p>

            <div class="result-list" id="resultList">
                <!-- 검색 결과가 여기에 표시됩니다 -->
            </div>
        </aside>

        <!-- 오른쪽 지도 -->
        <main class="map-area">
            <div id="map"></div>
        </main>

    </div>

    <!-- 카카오맵 JavaScript SDK를 불러옵니다 -->
    <script
        src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=37e3ecb214633fd4d266b251c8c3dd23&libraries=services&autoload=false"
        onerror="showSdkError()">
    </script>

    <script>
        // 지도와 검색에 사용할 변수를 선언합니다
        let map;
        let places;
        let markers = [];
        let infoWindow;
        let currentPosition = null;
        let isMapReady = false;

        const searchForm = document.getElementById("searchForm");
        const keywordInput = document.getElementById("keyword");
        const resultList = document.getElementById("resultList");
        const statusText = document.getElementById("status");

        // SDK 파일을 불러오지 못했을 때 안내합니다
        function showSdkError() {
            statusText.textContent =
                "카카오맵 SDK를 불러오지 못했습니다. 인터넷 연결과 JavaScript 키 설정을 확인해 주세요.";
        }

        // 지도 SDK가 준비된 뒤 지도와 검색 기능을 초기화합니다
        function initializeMap() {
            if (typeof kakao === "undefined" || !kakao.maps) {
                showSdkError();
                return;
            }

            kakao.maps.load(function () {
                try {
                    // 기본 위치는 서울시청으로 설정합니다
                    const defaultPosition = new kakao.maps.LatLng(
                        37.566826,
                        126.9786567
                    );

                    // 지도를 생성하고 확대 레벨을 5로 설정합니다
                    map = new kakao.maps.Map(
                        document.getElementById("map"),
                        {
                            center: defaultPosition,
                            level: 5
                        }
                    );

                    // 지도에 사용할 장소 검색 객체를 생성합니다
                    places = new kakao.maps.services.Places(map);

                    // 마커 클릭 시 장소 정보를 표시할 창을 생성합니다
                    infoWindow = new kakao.maps.InfoWindow({
                        zIndex: 1
                    });

                    isMapReady = true;
                    statusText.textContent =
                        "장소 이름을 입력해 검색하세요.";

                    // 검색 이벤트를 등록합니다
                    searchForm.addEventListener("submit", function (event) {
                        event.preventDefault();

                        const keyword = keywordInput.value.trim();

                        if (keyword === "") {
                            statusText.textContent =
                                "검색할 장소 이름을 입력해 주세요.";
                            return;
                        }

                        searchPlaces(keyword);
                    });

                    // 지도 생성이 끝난 뒤 현재 위치를 요청합니다
                    getCurrentLocation();

                } catch (error) {
                    console.error("지도 초기화 오류:", error);
                    statusText.textContent =
                        "지도를 초기화하지 못했습니다. API 키와 도메인 설정을 확인해 주세요.";
                }
            });
        }

        // 사용자의 현재 위치를 가져옵니다
        function getCurrentLocation() {
            if (!navigator.geolocation) {
                statusText.textContent =
                    "현재 위치 기능을 지원하지 않아 서울시청을 중심으로 표시합니다.";
                return;
            }

            statusText.textContent =
                "현재 위치를 확인하고 있습니다. 위치 권한을 허용해 주세요.";

            navigator.geolocation.getCurrentPosition(
                function (position) {
                    // 현재 위치의 위도와 경도를 가져옵니다
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;

                    currentPosition = new kakao.maps.LatLng(
                        latitude,
                        longitude
                    );

                    // 지도 중심을 현재 위치로 이동합니다
                    map.setCenter(currentPosition);
                    map.setLevel(5);

                    // 현재 위치에 마커를 표시합니다
                    const currentMarker = new kakao.maps.Marker({
                        map: map,
                        position: currentPosition
                    });

                    // 현재 위치 마커에 안내 창을 연결합니다
                    kakao.maps.event.addListener(
                        currentMarker,
                        "click",
                        function () {
                            infoWindow.setContent(
                                '<div style="padding:8px;font-size:13px;">현재 위치</div>'
                            );
                            infoWindow.open(map, currentMarker);
                        }
                    );

                    statusText.textContent =
                        "현재 위치를 표시했습니다. 장소를 검색해 보세요.";
                },
                function (error) {
                    // 위치 권한 거부 또는 위치 확인 실패 시 기본 위치를 사용합니다
                    console.warn("현재 위치 확인 실패:", error.message);

                    statusText.textContent =
                        "현재 위치를 확인할 수 없어 서울시청을 중심으로 표시합니다. 장소 검색은 가능합니다.";
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 60000
                }
            );
        }

        // 기존 검색 마커를 지도에서 제거합니다
        function clearMarkers() {
            markers.forEach(function (marker) {
                marker.setMap(null);
            });

            markers = [];
            infoWindow.close();
        }

        // 검색어로 장소를 검색합니다
        function searchPlaces(keyword) {
            if (!isMapReady || !places) {
                statusText.textContent =
                    "지도가 아직 준비되지 않았습니다.";
                return;
            }

            statusText.textContent = "장소를 검색하고 있습니다.";
            resultList.replaceChildren();
            clearMarkers();

            // 키워드 검색 결과를 콜백 함수로 전달받습니다
            places.keywordSearch(keyword, function (data, status) {
                if (status === kakao.maps.services.Status.OK) {
                    statusText.textContent =
                        "검색 결과 " + data.length + "개를 찾았습니다.";

                    // 검색 결과를 목록과 지도 마커로 표시합니다
                    data.forEach(function (place, index) {
                        displayPlace(place, index);
                    });

                } else if (
                    status === kakao.maps.services.Status.ZERO_RESULT
                ) {
                    statusText.textContent =
                        "검색 결과가 없습니다. 다른 검색어를 입력해 보세요.";

                } else {
                    statusText.textContent =
                        "검색 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.";
                }
            });
        }

        // 검색 결과 하나를 목록과 지도에 표시합니다
        function displayPlace(place, index) {
            const position = new kakao.maps.LatLng(
                Number(place.y),
                Number(place.x)
            );

            // 지도에 장소 마커를 생성합니다
            const marker = new kakao.maps.Marker({
                map: map,
                position: position
            });

            markers.push(marker);

            // 검색 결과 항목을 생성합니다
            const item = document.createElement("div");
            item.className = "result-item";

            const name = document.createElement("div");
            name.className = "place-name";
            name.textContent = (index + 1) + ". " + place.place_name;

            const category = document.createElement("div");
            category.className = "place-category";
            category.textContent = place.category_name || "분류 정보 없음";

            const address = document.createElement("div");
            address.className = "place-address";
            address.textContent =
                place.road_address_name ||
                place.address_name ||
                "주소 정보 없음";

            item.appendChild(name);
            item.appendChild(category);
            item.appendChild(address);

            // 전화번호가 있는 경우에만 표시합니다
            if (place.phone) {
                const phone = document.createElement("div");
                phone.className = "place-phone";
                phone.textContent = "전화: " + place.phone;
                item.appendChild(phone);
            }

            // 카카오맵 상세 페이지로 연결합니다
            if (place.place_url) {
                const link = document.createElement("a");
                link.className = "place-link";
                link.href = place.place_url;
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.textContent = "카카오맵에서 보기";

                item.appendChild(link);
            }

            // 결과 항목을 클릭하면 해당 장소로 이동합니다
            item.addEventListener("click", function () {
                map.setCenter(position);
                map.setLevel(5);

                infoWindow.setContent(
                    '<div style="padding:8px;font-size:13px;">' +
                    escapeHtml(place.place_name) +
                    "</div>"
                );

                infoWindow.open(map, marker);
            });

            // 장소 마커를 클릭해도 안내 창을 표시합니다
            kakao.maps.event.addListener(marker, "click", function () {
                map.setCenter(position);

                infoWindow.setContent(
                    '<div style="padding:8px;font-size:13px;">' +
                    escapeHtml(place.place_name) +
                    "</div>"
                );

                infoWindow.open(map, marker);
            });

            resultList.appendChild(item);
        }

        // HTML에 삽입되는 장소 이름의 특수문자를 처리합니다
        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, function (character) {
                const entities = {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                };

                return entities[character];
            });
        }

        // SDK가 로드된 뒤 지도 초기화를 시작합니다
        window.addEventListener("load", initializeMap);
    </script>
</body>
</html>
