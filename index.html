
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주변 문화시설 및 관광명소 찾기</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      padding: 20px;
      background: #263b80;
      color: white;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 23px;
    }

    header p {
      margin: 0;
      font-size: 14px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: white;
    }

    .tab {
      flex: 1;
      padding: 13px 8px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      font-size: 15px;
      cursor: pointer;
    }

    .tab.active {
      background: #263b80;
      color: white;
      border-color: #263b80;
      font-weight: bold;
    }

    #status {
      padding: 12px 16px;
      background: #fff;
      color: #555;
      font-size: 14px;
      text-align: center;
    }

    .container {
      display: grid;
      grid-template-columns: 350px minmax(0, 1fr);
      gap: 12px;
      padding: 12px;
      height: calc(100vh - 170px);
      min-height: 450px;
    }

    #placeList {
      overflow-y: auto;
      padding: 12px;
      background: white;
      border-radius: 10px;
    }

    .place-item {
      padding: 14px 8px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .place-item:hover {
      background: #f4f6fc;
    }

    .place-item h3 {
      margin: 0 0 7px;
      font-size: 16px;
    }

    .place-item p {
      margin: 4px 0;
      color: #555;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .place-item a {
      display: inline-block;
      margin-top: 7px;
      color: #3158c9;
      font-size: 13px;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 350px;
      border-radius: 10px;
      background: #e8eaf0;
    }

    .empty {
      padding: 30px 10px;
      color: #666;
      text-align: center;
      line-height: 1.7;
    }

    @media (max-width: 700px) {
      .container {
        grid-template-columns: 1fr;
        grid-template-rows: 280px minmax(350px, 1fr);
        height: auto;
      }

      #placeList {
        grid-row: 2;
      }

      #map {
        grid-row: 1;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>주변 장소 찾기</h1>
    <p>현재 위치 주변의 문화시설과 관광명소를 찾아보세요.</p>
  </header>

  <div class="tabs">
    <button class="tab active" id="cultureTab" type="button">
      문화시설
    </button>
    <button class="tab" id="tourTab" type="button">
      관광명소
    </button>
  </div>

  <div id="status" role="status" aria-live="polite">
    지도를 준비하고 있습니다...
  </div>

  <main class="container">
    <section id="placeList" aria-label="검색 결과">
      <div class="empty">검색 결과가 여기에 표시됩니다.</div>
    </section>
    <div id="map" aria-label="장소 지도"></div>
  </main>

  <!-- 본인의 카카오 JavaScript 키를 사용하세요. -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=37e3ecb214633fd4d266b251c8c3dd23&libraries=services&autoload=false">
  </script>

  <script>
    let map;
    let places;
    let infoWindow;
    let currentMarker;
    let currentPosition;

    let searchMarkers = [];
    let activeCategory = "CT1";
    let searchRequestId = 0;
    let isMapReady = false;

    const statusElement = document.getElementById("status");
    const placeList = document.getElementById("placeList");
    const cultureTab = document.getElementById("cultureTab");
    const tourTab = document.getElementById("tourTab");

    // 지도 초기화
    kakao.maps.load(function () {
      const defaultPosition = new kakao.maps.LatLng(
        37.5665,
        126.9780
      );

      map = new kakao.maps.Map(
        document.getElementById("map"),
        {
          center: defaultPosition,
          level: 5
        }
      );

      places = new kakao.maps.services.Places();
      infoWindow = new kakao.maps.InfoWindow({
        removable: true
      });

      isMapReady = true;
      getCurrentLocation();
    });

    // 현재 위치 가져오기
    function getCurrentLocation() {
      if (!navigator.geolocation) {
        useDefaultLocation(
          "이 브라우저에서는 위치 기능을 사용할 수 없습니다."
        );
        return;
      }

      statusElement.textContent = "현재 위치를 확인하고 있습니다...";

      navigator.geolocation.getCurrentPosition(
        function (position) {
          currentPosition = new kakao.maps.LatLng(
            position.coords.latitude,
            position.coords.longitude
          );

          map.setCenter(currentPosition);

          if (currentMarker) {
            currentMarker.setMap(null);
          }

          currentMarker = new kakao.maps.Marker({
            map: map,
            position: currentPosition,
            title: "현재 위치"
          });

          searchNearbyPlaces();
        },
        function () {
          useDefaultLocation(
            "위치를 확인할 수 없어 서울시청을 기준으로 검색합니다."
          );
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 60000
        }
      );
    }

    // 위치 확인에 실패했을 때 기본 위치 사용
    function useDefaultLocation(message) {
      currentPosition = new kakao.maps.LatLng(
        37.5665,
        126.9780
      );

      map.setCenter(currentPosition);

      if (currentMarker) {
        currentMarker.setMap(null);
      }

      currentMarker = new kakao.maps.Marker({
        map: map,
        position: currentPosition,
        title: "기본 검색 위치: 서울시청"
      });

      searchNearbyPlaces(message);
    }

    // 검색 결과와 기존 검색 마커 초기화
    function clearSearchResults() {
      // 이전 검색 요청의 결과가 늦게 도착해도 무시하도록 처리
      searchRequestId++;

      searchMarkers.forEach(function (marker) {
        marker.setMap(null);
      });

      searchMarkers = [];
      infoWindow.close();

      placeList.replaceChildren();
    }

    // 문화시설 또는 관광명소 검색
    function searchNearbyPlaces(extraMessage = "") {
      if (!isMapReady || !currentPosition) {
        return;
      }

      // 중요: 먼저 초기화한 뒤 현재 요청 번호를 저장해야 함
      clearSearchResults();
      const requestId = searchRequestId;

      statusElement.textContent =
        extraMessage || "주변 장소를 검색하고 있습니다...";

      const options = {
        location: currentPosition,
        radius: 5000,
        sort: kakao.maps.services.SortBy.DISTANCE,
        size: 15
      };

      places.categorySearch(
        activeCategory,
        function (data, status) {
          // 탭을 바꾼 뒤 도착한 이전 검색 결과는 무시
          if (requestId !== searchRequestId) {
            return;
          }

          if (status === kakao.maps.services.Status.OK) {
            if (!data || data.length === 0) {
              showEmptyMessage(
                "주변 5km 안에 검색 결과가 없습니다."
              );
              statusElement.textContent = "검색 결과가 없습니다.";
              return;
            }

            data.forEach(function (place, index) {
              displayPlace(place, index);
            });

            statusElement.textContent =
              "주변 장소 " + data.length + "개를 찾았습니다.";

          } else if (
            status === kakao.maps.services.Status.ZERO_RESULT
          ) {
            showEmptyMessage(
              "주변 5km 안에 검색 결과가 없습니다."
            );
            statusElement.textContent = "검색 결과가 없습니다.";

          } else {
            showEmptyMessage(
              "검색에 실패했습니다. 잠시 후 다시 시도해 주세요."
            );
            statusElement.textContent =
              "검색에 실패했습니다. 카카오 API 설정을 확인해 주세요.";
          }
        },
        options
      );
    }

    // 검색 결과가 없을 때 안내 표시
    function showEmptyMessage(message) {
      placeList.replaceChildren();

      const div = document.createElement("div");
      div.className = "empty";
      div.textContent = message;

      placeList.appendChild(div);
    }

    // 장소별 마커 이미지 생성
    function createMarkerImage(categoryCode) {
      const markerColor =
        categoryCode === "CT1" ? "#2878e5" : "#f28c28";

      const svg =
        '<svg xmlns="http://www.w3.org/2000/svg" width="36" height="46" viewBox="0 0 36 46">' +
        '<path d="M18 1C8.6 1 1 8.6 1 18c0 12 17 27 17 27s17-15 17-27C35 8.6 27.4 1 18 1Z" fill="' +
        markerColor +
        '" stroke="white" stroke-width="2"/>' +
        '<circle cx="18" cy="17" r="7" fill="white"/>' +
        "</svg>";

      const imageSrc =
        "data:image/svg+xml;charset=utf-8," +
        encodeURIComponent(svg);

      return new kakao.maps.MarkerImage(
        imageSrc,
        new kakao.maps.Size(36, 46),
        {
          offset: new kakao.maps.Point(18, 46)
        }
      );
    }

    // 장소 목록과 지도 마커 표시
    function displayPlace(place, index) {
      const categoryName =
        activeCategory === "CT1" ? "문화시설" : "관광명소";

      const marker = new kakao.maps.Marker({
        map: map,
        position: new kakao.maps.LatLng(
          Number(place.y),
          Number(place.x)
        ),
        title: place.place_name,
        image: createMarkerImage(activeCategory)
      });

      searchMarkers.push(marker);

      // 장소 목록 항목
      const item = document.createElement("div");
      item.className = "place-item";

      const name = document.createElement("h3");
      name.textContent = (index + 1) + ". " + place.place_name;
      item.appendChild(name);

      const category = document.createElement("p");
      category.textContent = categoryName;
      item.appendChild(category);

      const address = document.createElement("p");
      address.textContent =
        place.road_address_name || place.address_name || "주소 정보 없음";
      item.appendChild(address);

      if (place.phone) {
        const phone = document.createElement("p");
        phone.textContent = "전화: " + place.phone;
        item.appendChild(phone);
      }

      if (place.place_url) {
        const link = document.createElement("a");
        link.href = place.place_url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "카카오맵에서 보기";
        link.addEventListener("click", function (event) {
          event.stopPropagation();
        });
        item.appendChild(link);
      }

      item.addEventListener("click", function () {
        map.panTo(marker.getPosition());

        showInfoWindow(
          marker,
          place.place_name,
          place.road_address_name || place.address_name || "주소 정보 없음",
          categoryName,
          place.phone,
          place.place_url
        );
      });

      placeList.appendChild(item);

      // 마커를 클릭하면 장소 상세 정보 표시
      kakao.maps.event.addListener(marker, "click", function () {
        showInfoWindow(
          marker,
          place.place_name,
          place.road_address_name || place.address_name || "주소 정보 없음",
          categoryName,
          place.phone,
          place.place_url
        );
      });
    }

    // 마커 클릭 시 정보 창 표시
    function showInfoWindow(
      marker,
      placeName,
      placeAddress,
      placeCategory,
      placePhone,
      placeUrl
    ) {
      const content = document.createElement("div");
      content.style.cssText =
        "padding:12px;max-width:250px;font-size:13px;line-height:1.6;overflow-wrap:anywhere;";

      const name = document.createElement("strong");
      name.textContent = placeName;
      name.style.display = "block";
      name.style.marginBottom = "5px";
      content.appendChild(name);

      const category = document.createElement("div");
      category.textContent = placeCategory;
      content.appendChild(category);

      const address = document.createElement("div");
      address.textContent = placeAddress;
      content.appendChild(address);

      if (placePhone) {
        const phone = document.createElement("div");
        phone.textContent = "전화: " + placePhone;
        content.appendChild(phone);
      }

      if (placeUrl) {
        const link = document.createElement("a");
        link.href = placeUrl;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "카카오맵에서 보기";
        link.style.display = "block";
        link.style.marginTop = "5px";
        content.appendChild(link);
      }

      infoWindow.setContent(content);
      infoWindow.open(map, marker);
    }

    // 탭 전환
    function changeCategory(categoryCode) {
      activeCategory = categoryCode;

      cultureTab.classList.toggle(
        "active",
        categoryCode === "CT1"
      );

      tourTab.classList.toggle(
        "active",
        categoryCode === "AT4"
      );

      if (!isMapReady || !currentPosition) {
        return;
      }

      searchNearbyPlaces();
    }

    cultureTab.addEventListener("click", function () {
      changeCategory("CT1");
    });

    tourTab.addEventListener("click", function () {
      changeCategory("AT4");
    });
  </script>
</body>
</html>
