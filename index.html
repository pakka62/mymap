
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문화시설 · 관광지 찾기</title>

    <style>
        /* 전체 페이지의 기본 설정 */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Malgun Gothic", sans-serif;
            color: #222;
        }

        /* 화면을 왼쪽과 오른쪽으로 나눕니다 */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 검색 영역 */
        .sidebar {
            width: 360px;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            padding: 24px 20px;
            background: #ffffff;
            border-right: 1px solid #dddddd;
            overflow: hidden;
        }

        .title {
            margin: 0 0 8px;
            font-size: 24px;
        }

        .description {
            margin: 0 0 18px;
            color: #777777;
            font-size: 13px;
            line-height: 1.5;
        }

        /* 문화시설과 관광지 탭 */
        .tab-container {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        .tab-button {
            flex: 1;
            padding: 12px 8px;
            border: 1px solid #dddddd;
            border-radius: 8px;
            background: #f5f5f5;
            color: #444444;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .tab-button.active {
            border-color: #fee500;
            background: #fee500;
            color: #222222;
        }

        .tab-button:focus-visible {
            outline: 2px solid #333333;
            outline-offset: 2px;
        }

        /* 현재 위치 버튼 */
        .location-button {
            width: 100%;
            margin-bottom: 12px;
            padding: 10px;
            border: 1px solid #dddddd;
            border-radius: 8px;
            background: #ffffff;
            cursor: pointer;
        }

        .location-button:hover {
            background: #f7f7f7;
        }

        /* 상태 메시지 */
        .status {
            margin: 0 0 12px;
            color: #666666;
            font-size: 13px;
            line-height: 1.6;
        }

        /* 검색 결과 목록 */
        .result-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            border-top: 1px solid #eeeeee;
        }

        .result-item {
            padding: 14px 5px;
            border-bottom: 1px solid #eeeeee;
            cursor: pointer;
        }

        .result-item:hover,
        .result-item.selected {
            background: #fffbea;
        }

        .place-name {
            margin-bottom: 7px;
            font-size: 15px;
            font-weight: bold;
            line-height: 1.5;
        }

        .place-category {
            margin-bottom: 5px;
            color: #777777;
            font-size: 12px;
            line-height: 1.5;
        }

        .place-address {
            color: #555555;
            font-size: 13px;
            line-height: 1.6;
        }

        .place-phone {
            margin-top: 5px;
            color: #777777;
            font-size: 12px;
        }

        .place-link {
            display: inline-block;
            margin-top: 8px;
            color: #2468c9;
            font-size: 13px;
            text-decoration: none;
        }

        .place-link:hover {
            text-decoration: underline;
        }

        /* 오른쪽 지도 영역 */
        .map-area {
            position: relative;
            flex: 1;
            min-width: 0;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* 모바일 화면 대응 */
        @media (max-width: 700px) {
            .container {
                flex-direction: column;
                height: 100vh;
            }

            .sidebar {
                width: 100%;
                min-width: 0;
                height: 48%;
                padding: 16px;
                border-right: none;
                border-bottom: 1px solid #dddddd;
            }

            .title {
                font-size: 21px;
            }

            .map-area {
                flex: 1;
                min-height: 0;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- 왼쪽 탭과 장소 목록 -->
        <aside class="sidebar">

            <h1 class="title">주변 장소 찾기</h1>

            <p class="description">
                현재 위치 주변의 문화시설과 관광지를 찾아보세요.
            </p>

            <!-- 탭 버튼 2개 -->
            <div class="tab-container">
                <button
                    type="button"
                    class="tab-button active"
                    id="cultureTab"
                    aria-pressed="true">
                    문화시설
                </button>

                <button
                    type="button"
                    class="tab-button"
                    id="tourTab"
                    aria-pressed="false">
                    관광지
                </button>
            </div>

            <!-- 현재 위치를 다시 확인하는 버튼 -->
            <button
                type="button"
                class="location-button"
                id="locationButton">
                현재 위치로 이동
            </button>

            <p class="status" id="status" aria-live="polite">
                지도를 불러오는 중입니다.
            </p>

            <!-- 검색 결과가 표시되는 영역 -->
            <div class="result-list" id="resultList">
            </div>

        </aside>

        <!-- 오른쪽 카카오맵 -->
        <main class="map-area">
            <div id="map"></div>
        </main>

    </div>

    <!-- 카카오맵 JavaScript SDK -->
    <script
        src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=37e3ecb214633fd4d266b251c8c3dd23&libraries=services&autoload=false"
        onerror="showSdkError()">
    </script>

    <script>
        // 지도와 검색 기능에 사용할 변수를 선언합니다
        let map;
        let places;
        let infoWindow;
        let currentMarker = null;
        let currentPosition = null;
        let searchMarkers = [];
        let isMapReady = false;
        let activeCategory = "CT1";
        let searchRequestId = 0;

        // 검색 반경은 5km로 설정합니다
        const searchRadius = 5000;

        // HTML 요소를 가져옵니다
        const cultureTab = document.getElementById("cultureTab");
        const tourTab = document.getElementById("tourTab");
        const locationButton = document.getElementById("locationButton");
        const resultList = document.getElementById("resultList");
        const statusText = document.getElementById("status");

        // 기본 위치는 서울시청으로 설정합니다
        const defaultLatitude = 37.566826;
        const defaultLongitude = 126.9786567;

        // SDK를 불러오지 못했을 때 안내합니다
        function showSdkError() {
            statusText.textContent =
                "카카오맵 SDK를 불러오지 못했습니다. 인터넷 연결과 API 키, Web 도메인 설정을 확인해 주세요.";
        }

        // SDK가 준비된 뒤 지도를 초기화합니다
        function initializeMap() {
            if (typeof kakao === "undefined" || !kakao.maps) {
                showSdkError();
                return;
            }

            kakao.maps.load(function () {
                try {
                    // 기본 위치를 중심으로 지도를 생성합니다
                    const defaultPosition = new kakao.maps.LatLng(
                        defaultLatitude,
                        defaultLongitude
                    );

                    map = new kakao.maps.Map(
                        document.getElementById("map"),
                        {
                            center: defaultPosition,
                            level: 5
                        }
                    );

                    // 장소 검색 객체를 생성합니다
                    places = new kakao.maps.services.Places(map);

                    // 장소 상세 정보를 보여줄 팝업을 생성합니다
                    infoWindow = new kakao.maps.InfoWindow({
                        zIndex: 10
                    });

                    // 지도가 준비되었음을 표시합니다
                    isMapReady = true;

                    // 탭 버튼 이벤트를 등록합니다
                    cultureTab.addEventListener("click", function () {
                        changeCategory("CT1");
                    });

                    tourTab.addEventListener("click", function () {
                        changeCategory("AT4");
                    });

                    // 현재 위치 버튼 이벤트를 등록합니다
                    locationButton.addEventListener(
                        "click",
                        getCurrentLocation
                    );

                    // 현재 위치를 확인한 후 주변 장소를 검색합니다
                    getCurrentLocation();

                } catch (error) {
                    console.error("지도 초기화 오류:", error);

                    statusText.textContent =
                        "지도 초기화에 실패했습니다. API 키와 Web 도메인 설정을 확인해 주세요.";
                }
            });
        }

        // 현재 위치를 가져옵니다
        function getCurrentLocation() {
            if (!isMapReady) {
                return;
            }

            if (!navigator.geolocation) {
                statusText.textContent =
                    "현재 위치 기능을 지원하지 않습니다. 서울시청 주변 장소를 표시합니다.";

                setDefaultLocation();
                return;
            }

            statusText.textContent =
                "현재 위치를 확인하고 있습니다. 위치 권한을 허용해 주세요.";

            navigator.geolocation.getCurrentPosition(
                function (position) {
                    // 현재 위치의 위도와 경도를 저장합니다
                    currentPosition = new kakao.maps.LatLng(
                        position.coords.latitude,
                        position.coords.longitude
                    );

                    // 지도 중심을 현재 위치로 이동합니다
                    map.setCenter(currentPosition);
                    map.setLevel(5);

                    // 현재 위치 마커를 표시합니다
                    showCurrentMarker();

                    // 현재 선택된 탭의 장소를 검색합니다
                    searchNearbyPlaces();
                },

                function (error) {
                    // 위치 확인에 실패하면 기본 위치를 사용합니다
                    console.warn("위치 확인 실패:", error.message);

                    statusText.textContent =
                        "현재 위치를 확인하지 못했습니다. 서울시청 주변 장소를 표시합니다.";

                    setDefaultLocation();
                },

                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 60000
                }
            );
        }

        // 기본 위치를 설정합니다
        function setDefaultLocation() {
            currentPosition = new kakao.maps.LatLng(
                defaultLatitude,
                defaultLongitude
            );

            map.setCenter(currentPosition);
            map.setLevel(5);

            showCurrentMarker();
            searchNearbyPlaces();
        }

        // 현재 위치 마커를 표시합니다
        function showCurrentMarker() {
            if (currentMarker) {
                currentMarker.setMap(null);
            }

            currentMarker = new kakao.maps.Marker({
                map: map,
                position: currentPosition,
                title: "현재 위치"
            });

            kakao.maps.event.addListener(
                currentMarker,
                "click",
                function () {
                    showInfoWindow(
                        currentMarker,
                        "현재 위치",
                        "현재 위치"
                    );
                }
            );
        }

        // 탭을 변경하고 검색을 실행합니다
        function changeCategory(categoryCode) {
            activeCategory = categoryCode;

            // 선택된 탭의 모양과 접근성 상태를 변경합니다
            cultureTab.classList.toggle(
                "active",
                categoryCode === "CT1"
            );

            tourTab.classList.toggle(
                "active",
                categoryCode === "AT4"
            );

            cultureTab.setAttribute(
                "aria-pressed",
                String(categoryCode === "CT1")
            );

            tourTab.setAttribute(
                "aria-pressed",
                String(categoryCode === "AT4")
            );

            // 기존 결과를 지우고 새 카테고리를 검색합니다
            clearSearchResults();

            if (!isMapReady) {
                statusText.textContent =
                    "지도를 불러오는 중입니다.";
                return;
            }

            if (!currentPosition) {
                getCurrentLocation();
                return;
            }

            searchNearbyPlaces();
        }

        // 현재 위치 주변에서 선택한 카테고리를 검색합니다
        function searchNearbyPlaces() {
            if (!isMapReady || !places || !currentPosition) {
                return;
            }

            // 이전 검색의 응답이 나중에 도착하더라도 무시할 수 있도록 합니다
            const requestId = ++searchRequestId;

            // 기존 결과와 마커를 제거합니다
            clearSearchResults();

            const categoryName =
                activeCategory === "CT1" ? "문화시설" : "관광지";

            statusText.textContent =
                categoryName + "을(를) 검색하고 있습니다.";

            // 카카오맵 카테고리 검색을 실행합니다
            places.categorySearch(
                activeCategory,
                function (data, status, pagination) {
                    // 더 최근에 시작한 검색이 있다면 이전 응답은 무시합니다
                    if (requestId !== searchRequestId) {
                        return;
                    }

                    if (
                        status === kakao.maps.services.Status.OK
                    ) {
                        if (data.length === 0) {
                            statusText.textContent =
                                "검색 결과가 없습니다.";
                            return;
                        }

                        statusText.textContent =
                            categoryName + " 검색 결과 " +
                            data.length + "개를 찾았습니다.";

                        // 검색 결과를 목록과 지도에 표시합니다
                        data.forEach(function (place, index) {
                            displayPlace(place, index);
                        });

                    } else if (
                        status === kakao.maps.services.Status.ZERO_RESULT
                    ) {
                        statusText.textContent =
                            "주변에 검색 결과가 없습니다. 다른 탭을 선택해 보세요.";

                    } else {
                        statusText.textContent =
                            "검색 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.";
                    }
                },
                {
                    // 현재 위치를 검색 중심으로 사용합니다
                    location: currentPosition,

                    // 현재 위치에서 5km 이내의 장소를 검색합니다
                    radius: searchRadius,

                    // 가까운 장소부터 표시합니다
                    sort: kakao.maps.services.SortBy.DISTANCE,

                    // 한 페이지에 최대 15개를 표시합니다
                    size: 15
                }
            );
        }

        // 기존 검색 마커와 목록을 제거합니다
        function clearSearchResults() {
            // 이전 검색 응답이 현재 목록을 덮어쓰지 않도록 합니다
            searchRequestId++;

            // 검색 마커만 제거하고 현재 위치 마커는 유지합니다
            searchMarkers.forEach(function (marker) {
                marker.setMap(null);
            });

            searchMarkers = [];

            // 장소 목록을 비웁니다
            resultList.replaceChildren();

            // 기존 팝업을 닫습니다
            if (infoWindow) {
                infoWindow.close();
            }
        }

        // 검색된 장소 하나를 목록과 지도에 표시합니다
        function displayPlace(place, index) {
            const position = new kakao.maps.LatLng(
                Number(place.y),
                Number(place.x)
            );

            // 지도에 장소 마커를 생성합니다
            const marker = new kakao.maps.Marker({
                map: map,
                position: position,
                title: place.place_name
            });

            searchMarkers.push(marker);

            // 검색 결과 항목을 생성합니다
            const item = document.createElement("div");
            item.className = "result-item";

            const name = document.createElement("div");
            name.className = "place-name";
            name.textContent =
                (index + 1) + ". " + place.place_name;

            const category = document.createElement("div");
            category.className = "place-category";
            category.textContent =
                place.category_name || "분류 정보 없음";

            const address = document.createElement("div");
            address.className = "place-address";
            address.textContent =
                place.road_address_name ||
                place.address_name ||
                "주소 정보 없음";

            item.appendChild(name);
            item.appendChild(category);
            item.appendChild(address);

            // 전화번호가 있는 경우에만 표시합니다
            if (place.phone) {
                const phone = document.createElement("div");
                phone.className = "place-phone";
                phone.textContent = "전화: " + place.phone;
                item.appendChild(phone);
            }

            // 카카오맵 상세 페이지 링크를 추가합니다
            if (place.place_url) {
                const link = document.createElement("a");

                link.className = "place-link";
                link.href = place.place_url;
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.textContent = "카카오맵에서 보기";

                // 링크 클릭이 장소 선택 이벤트로 이어지지 않게 합니다
                link.addEventListener("click", function (event) {
                    event.stopPropagation();
                });

                item.appendChild(link);
            }

            // 목록을 클릭하면 지도 중심을 해당 장소로 이동합니다
            item.addEventListener("click", function () {
                map.panTo(position);

                // 선택한 목록을 강조 표시합니다
                document.querySelectorAll(".result-item").forEach(
                    function (resultItem) {
                        resultItem.classList.remove("selected");
                    }
                );

                item.classList.add("selected");

                // 장소 이름과 주소를 팝업에 표시합니다
                showInfoWindow(
                    marker,
                    place.place_name,
                    place.road_address_name ||
                    place.address_name ||
                    "주소 정보 없음"
                );
            });

            // 마커를 클릭해도 이름과 주소를 표시합니다
            kakao.maps.event.addListener(marker, "click", function () {
                map.panTo(position);

                document.querySelectorAll(".result-item").forEach(
                    function (resultItem) {
                        resultItem.classList.remove("selected");
                    }
                );

                item.classList.add("selected");

                showInfoWindow(
                    marker,
                    place.place_name,
                    place.road_address_name ||
                    place.address_name ||
                    "주소 정보 없음"
                );
            });

            resultList.appendChild(item);
        }

        // 장소 이름과 주소를 팝업에 표시합니다
        function showInfoWindow(marker, placeName, placeAddress) {
            // 외부 데이터는 HTML에 안전하게 표시하도록 처리합니다
            const content = document.createElement("div");

            content.style.cssText =
                "padding:10px; max-width:240px; font-size:13px; line-height:1.6;";

            const nameElement = document.createElement("div");
            nameElement.style.cssText =
                "font-weight:bold; margin-bottom:5px;";

            nameElement.textContent = placeName;

            const addressElement = document.createElement("div");
            addressElement.style.color = "#555555";
            addressElement.textContent = placeAddress;

            content.appendChild(nameElement);
            content.appendChild(addressElement);

            infoWindow.setContent(content);
            infoWindow.open(map, marker);
        }

        // SDK가 로드된 뒤 지도 초기화를 시작합니다
        window.addEventListener("load", initializeMap);
    </script>
</body>
</html>
